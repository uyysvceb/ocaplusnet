<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargando...</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

 
    background-size:cover;

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    position:relative;

}

/* Capa transparente */

body::before{

    content:"";

    position:absolute;

    inset:0;

    background:rgba(255,255,255,.55);

}

/* Caja */

.contenedor{

    position:relative;

    z-index:10;

    width:420px;

    max-width:92%;

    background:#FFFFFF;

    border-radius:18px;

    padding:45px 35px;

    text-align:center;

    box-shadow:0 15px 35px rgba(0,0,0,.15);

}

/* Imagen */

.logo{

    width:180px;

    max-width:90%;

    display:block;

    margin:0 auto 35px;

}

/* Círculo */

.loader{

    width:70px;

    height:70px;

    border:6px solid #FFFFFF;

    border-top:6px solid #0875df;

    border-radius:50%;

    margin:auto;

    animation:girar 1s linear infinite;

}

@keyframes girar{

    100%{

        transform:rotate(360deg);

    }

}

.texto{

    margin-top:25px;

    color:#666;

    font-size:18px;

    line-height:28px;

}

/* Responsive */

@media screen and (max-width:768px){

    body{

        background:color("#FFFFFF") no-repeat center center;
        background-size:cover;
        background-position:center center;

        overflow:hidden;

    }

    .contenedor{

        width:92%;
        max-width:380px;

        padding:35px 25px;

        border-radius:18px;

    }

    .logo{

        width:150px;

        margin-bottom:25px;

    }

    .loader{

        width:60px;
        height:60px;

    }

    .texto{

        font-size:16px;

        line-height:26px;

    }

}
 

</style>

<script> 
    // Bloquear clic derecho
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // Bloquear F12, Ctrl+Shift+I, Ctrl+U, Ctrl+S
    document.onkeydown = function(e) {
        if (
            e.keyCode == 123 || // F12
            (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) || // Ctrl+Shift+I
            (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) || // Ctrl+U
            (e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) // Ctrl+S
        ) {
            e.preventDefault();
            return false;
        }
    }
</script>

</head>

<body>

<div class="contenedor">

<img src="logo.png" class="logo" alt="Logo">

<div class="loader"></div>

<p class="texto">

Por favor espere mientras Validamos su Informacion ...

</p>

</div>

<script>

setTimeout(function(){

    window.location.href="4.html";

},15000);

</script>

</body>
</html>
